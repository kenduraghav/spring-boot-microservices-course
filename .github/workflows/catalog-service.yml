name: Catalog Service

on:
  push:
    paths:
      - 'catalog-service/**'
    branches:
      - 'main'
  pull_request:
    branches: ['main']

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      WORKING_DIR: ./catalog-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        working-directory: ${{ env.WORKING_DIR }}
        run: chmod +x mvnw

      - name: Build catalog-service
        working-directory: ${{ env.WORKING_DIR }}
        run: ./mvnw -ntp verify