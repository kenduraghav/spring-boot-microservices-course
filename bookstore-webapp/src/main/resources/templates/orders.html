<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
	<div th:x-data="|initData()|">
		<h2>Your Orders</h2>
		<hr/>
		<div x-show="orders.length === 0" class="alert alert-info">
            No orders found.
         </div>
		<div class="table-responsive">
			<table class="table table-striped table-bordered">
				
				<thead>
					<tr>
						<th scope="col">#</th>
						<th scope="col">Order Number</th>
						<th scope="col">Order Status</th>
						<th scope="col">Action</th>
					</tr>
				</thead>
				
				<tbody>
					<template x-for="(order,index) in orders">
						<tr>
						 <td scope="row" x-text="index + 1">1</td>
						 <td scope="row" x-text="order.orderNumber">orderNumber</td>
						 <td scope="row" x-text="order.status">status</td>
						 <td>
						 	<a href="#" class="link-primary" @click.prevent="viewOrderDetails(order.orderNumber)">View Order Details</a>
						 </td>
					</template>
				</tbody>
			</table>
		</div>
	</div>
</div>
<div layout:fragment="scripts">
    <script src="/js/orderHistory.js"></script>
</div>
</body>
</html>
