<!DocType html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org"
	xmln:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
<meta charset="UTF-8">
<title>BookStore</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<link rel="stylesheet"
	href="/webjars/bootstrap/5.3.3/css/bootstrap.css">
<link rel="stylesheet"
	href="/webjars/font-awesome/7.2.0/css/all.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
	<main>
		<nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark">
			<div class="container">
				<a class="navbar-brand" href="#" th:href="@{/}">BookStore</a>
				<button class="navbar-toggler" type="button"
					data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
					aria-controls="navbarSupportedContent" aria-expanded="false"
					aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav ms-auto mb-2 mb-lg-0">
						<li class="nav-item" sec:authorize="isAuthenticated()">
							<a class="nav-link" href="/orders" th:href="@{/orders}">Orders
							</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/cart" th:href="@{/cart}">
								Cart (<span id="cart-item-count">0</span>)
							</a>
						</li>
						<li class="nav-item" sec:authorize="!isAuthenticated()">
							<a class="nav-link" href="/oauth2/authorization/bookstore-webapp">
							Login
							</a>
						</li>
						<li class="nav-item" sec:authorize="isAuthenticated()">
							<a class="nav-link" href="/logout">
							Logout
							</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>
		<div id="app" class="container mt-5 pt-5">
			<div layout:fragment="content">
				<!-- Content will be injected here -->
			</div>
		</div>
	</main>
	<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.js"></script>
	<script src="/webjars/jquery/4.0.0/jquery.js"></script>
	<script defer src="/webjars/alpinejs/3.15.4/dist/cdn.min.js"></script>
	<script src="/js/cartStore.js"></script>
	<div layout:fragment="scripts"></div>
</body>
</html>
